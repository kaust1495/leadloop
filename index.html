<style>
:root{
  --forest:#14492f; --leaf:#1f7a4d; --leafSoft:#e2efe6; --saffron:#e0962a; --saffronSoft:#fbecd2; --saffronInk:#7a4600;
  --hivis:#d8f04a; --casing:#2b3236; --casing2:#3a4348; --paper:#f1f3ee; --card:#ffffff; --ink:#1b2420; --muted:#5b665f; --line:#d9dfd8;
  --red:#b3261e; --redSoft:#fbe4e1; --blue:#245a8f; --blueSoft:#e4edf7;
  --slab:"Bricolage Grotesque","Mukta",system-ui,sans-serif; --sans:"Mukta",system-ui,sans-serif;
  --r-panel:22px; --r-sheet:14px; --r-slip:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.45;-webkit-text-size-adjust:100%}
body.demo-on,body.tour-on{padding-bottom:160px}
.tourbar .prog i{position:relative;overflow:hidden}
.tourbar .prog b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hivis);animation:tfill linear forwards}
@keyframes tfill{to{width:100%}}
.tourbar .go{min-width:120px}
:lang(hi), .hi{font-family:"Mukta",var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 48px}
.wide .wrap{max-width:1200px}
.mid .wrap{max-width:880px}
.mid header.top .in{max-width:880px}
.num,td.num,th.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:15;background:var(--forest);color:#fff}
header.top .in{max-width:560px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:8px}
.wide header.top .in{max-width:1200px}
.logo{font-family:var(--slab);font-weight:700;font-size:21px;display:flex;align-items:center;gap:7px;background:none;border:0;color:#fff;cursor:pointer;padding:4px 0}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;min-height:34px;white-space:nowrap}
.hbtn svg{width:20px;height:20px}
.hbtn.solid{background:var(--hivis);color:var(--casing);border-color:var(--hivis)}
.hbtn.on{background:rgba(255,255,255,.14)}
.hbtn .lbs{display:none}
@media (max-width:560px){.hbtn .lbl{display:none}.hbtn .lbs{display:inline}.hbtn{padding:5px 9px}}

/* role switcher sheet */
.switch h2{margin:0 0 2px}
.chain{display:grid;gap:12px;margin-top:10px}
.stage{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start}
.stage .sn{font-family:var(--slab);font-weight:600;color:var(--forest);font-size:15px;padding-top:9px;line-height:1.15}
.stage .sn small{display:block;font-family:var(--sans);font-weight:600;color:var(--muted);font-size:11.5px}
.who-row{display:flex;flex-wrap:wrap;gap:8px}
.whob{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px 6px 6px;cursor:pointer;min-height:48px;text-align:left}
.whob svg{width:32px;height:32px;flex:none}
.whob b{display:block;font-size:14.5px;line-height:1.1}
.whob span span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.whob.cur{border-color:var(--forest);box-shadow:inset 0 0 0 1.5px var(--forest)}
.whob:hover{border-color:var(--leaf)}

/* ---------- type ---------- */
h1{font-family:var(--slab);font-weight:700;font-size:28px;line-height:1.1;margin:18px 0 6px;letter-spacing:-.2px}
h2{font-family:var(--slab);font-weight:600;font-size:20px;margin:22px 0 10px;line-height:1.2}
h3{font-size:15px;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 14px;font-size:15px;max-width:60ch}
.muted{color:var(--muted)} .small{font-size:13px}
.hidden{display:none!important}
.skip{position:absolute;left:-9999px;top:0;z-index:2000}
.skip:focus{left:8px;top:8px;padding:10px 14px;background:var(--card,#fff);color:var(--ink,#111);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.22);font-weight:700}

/* ---------- three surfaces: sheet (records), slip (money/manifests), panel (live scans) ---------- */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sheet);padding:16px;margin:12px 0}
.sheet.tight{padding:12px 14px}
.sheet.accent{border:2px solid var(--forest)}
.slip{position:relative;background:#fffdf7;border:1px solid #e6dcc6;border-left:5px solid var(--saffron);border-radius:var(--r-slip);padding:14px 16px;margin:12px 0;
  background-image:radial-gradient(circle at 0 0,transparent 0,transparent 0)}
.slip:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:6px;background:radial-gradient(circle at 5px 6px,var(--paper) 3.2px,transparent 3.6px) 0 0/12px 6px repeat-x}
.slip .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.slip .ref{font-family:var(--slab);font-weight:700;font-size:19px;letter-spacing:.3px}
.slip .amt{font-family:var(--slab);font-weight:700;font-size:26px;line-height:1}
.slip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0 0;font-size:14px}
.slip dt{color:var(--muted)} .slip dd{margin:0;font-weight:600}
.slip .tot{border-top:1.5px dashed #d8ccb0;margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;font-weight:800}
.panel{background:var(--casing);color:#fff;border-radius:var(--r-panel);padding:16px;margin:12px 0}

/* ---------- buttons & inputs ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:14px;border:0;background:var(--forest);color:#fff;font-weight:700;font-size:17px;cursor:pointer;padding:10px 16px;margin:8px 0;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn>svg{width:22px;height:22px;flex:none}
.btn.sec{background:#fff;color:var(--forest);border:2px solid var(--forest)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--line);font-weight:600;font-size:15px;min-height:46px}
.btn.hv{background:var(--hivis);color:var(--casing)}
.btn.small{min-height:40px;font-size:14px;width:auto;display:inline-flex;margin:4px 6px 4px 0;padding:8px 14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--forest);font-weight:700;cursor:pointer;padding:10px 0;display:inline-flex;align-items:center;gap:6px;font-size:15px}
label.f{display:block;font-weight:700;margin:20px 0 8px;font-size:15px}
label.f .opt{font-weight:500;color:var(--muted);font-size:13px}
input.t,select.t,textarea.t{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:18px}
textarea.t{min-height:80px;font-size:15px}
input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px var(--leafSoft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 auto;min-height:52px;min-width:28%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.chip svg{width:26px;height:26px;flex:none}
.chip.tile{flex-direction:column;gap:4px;min-height:82px;min-width:30%;font-size:14px}
.chip.tile svg{width:40px;height:30px}
.chip.n{min-width:56px;flex:0 1 auto;font-size:18px}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.chip.on.warn{background:var(--red);border-color:var(--red)}
.row{display:flex;gap:10px;align-items:center}
.wrapr{flex-wrap:wrap}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.banner.err{background:var(--redSoft);color:var(--red)}
.banner.warn{background:var(--saffronSoft);color:#6e4200}
.banner.ok{background:var(--leafSoft);color:var(--forest)}
.banner.info{background:var(--blueSoft);color:var(--blue)}

/* ---------- status marks: scan pips, flags, custody clock ---------- */
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.pips{display:inline-flex;gap:2px}
.pips i{width:9px;height:9px;border-radius:2px;border:1.5px solid currentColor;display:block}
.pips i.f{background:currentColor}
.st-unused{color:#5b665f} .st-picked_up{color:#9a5a00} .st-at_yard{color:var(--blue)} .st-closed{color:var(--forest)}
.st .t{color:var(--ink)}
.mk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap;border-radius:6px;padding:2px 8px 2px 5px}
.mk svg{width:14px;height:14px;flex:none}
.mk.flag{background:var(--redSoft);color:var(--red)}
.mk.warn{background:var(--saffronSoft);color:var(--saffronInk)}
.mk.ok{background:var(--leafSoft);color:var(--forest)}
.mk.info{background:var(--blueSoft);color:var(--blue)}
.mk.neutral{background:#eceee9;color:#4f5a54}
.clock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.clock .bar{position:relative;width:46px;height:6px;border-radius:3px;background:#e3e7e1;overflow:hidden}
.clock .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.clock .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--casing);left:11%}

/* sticker id */
.sticker{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;background:var(--hivis);color:var(--casing);border-radius:8px;padding:5px 12px 5px 8px;font-family:var(--slab);font-weight:700;font-size:24px;letter-spacing:.5px;box-shadow:inset 0 0 0 2px rgba(43,50,54,.15)}
.sticker svg{width:22px;height:22px}
.sticker.sm{font-size:15px;padding:2px 8px 2px 5px;border-radius:6px}
.sticker.sm svg{width:14px;height:14px}

/* ---------- metric tiles with context ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tilem{background:#fff;border:1px solid var(--line);border-radius:var(--r-sheet);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:108px}
button.tilem{cursor:pointer;font:inherit;color:inherit}
button.tilem:hover{border-color:var(--leaf)}
.tilem .l{font-size:13px;color:var(--muted);font-weight:600}
.tilem .v{font-family:var(--slab);font-size:30px;font-weight:700;line-height:1}
.tilem .v small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.tilem .c{font-size:12.5px;color:var(--muted);margin-top:auto}
.tilem.bad .v{color:var(--red)} .tilem.amber .v{color:var(--saffronInk)}
.bullet{position:relative;height:8px;border-radius:4px;background:#e9ece6;margin-top:6px;overflow:hidden}
.bullet i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--leaf)}
.bullet b{position:absolute;top:0;bottom:0;width:2px;background:var(--casing)}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}.tilem .v{font-size:26px}}

/* ---------- hero / login ---------- */
.hero{background:var(--forest);color:#fff;border-radius:20px;overflow:hidden;margin:14px 0 18px}
.hero .txt{padding:18px 18px 4px}
.hero h1{margin:0 0 6px;color:#fff;font-size:30px}
.hero p{margin:0;color:#cfe3d6;font-size:15px;max-width:44ch}
.hero svg.scene{display:block;width:100%;height:auto}
.fresh{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* simple landing page */
.landing{padding:28px 0 8px}
.landing h1{margin:0 0 10px;font-size:32px;line-height:1.1;color:var(--forest)}
.landing p{margin:0 0 20px;color:var(--muted);font-size:16.5px;max-width:46ch}
.landing .btn{min-height:60px;font-size:18px;margin:0}
.landing-h{font-size:16px;color:var(--muted);font-weight:600;margin:30px 0 4px}
.logo{min-height:44px}
@media (max-width:560px){.landing h1{font-size:28px}}

/* scan button */
.scanbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:200px;border:0;border-radius:var(--r-panel);background:var(--casing);color:#fff;cursor:pointer;margin:10px 0 6px;overflow:hidden;font-weight:700;font-size:20px}
.scanbtn .vf{position:relative;width:110px;height:110px}
.scanbtn .vf svg{width:110px;height:110px}
.scanbtn .vf:after{content:"";position:absolute;left:10px;right:10px;top:12px;height:3px;border-radius:3px;background:var(--hivis);box-shadow:0 0 12px var(--hivis);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(0)}50%{transform:translateY(84px)}}
.scanbtn small{font-weight:500;font-size:13px;color:#c8d0cc}
.scanbtn.busy .vf:after{animation-duration:.7s}
.rolehead{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.rolehead .ri{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.rolehead .ri svg{width:38px;height:38px}
.rolehead h1{margin:0}
.rolehead .who2{font-size:13px;color:var(--muted);font-weight:600}

/* list rows */
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.lrow:hover{border-color:var(--leaf)}
.lrow .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.lrow .sub2{font-size:12.5px;color:var(--muted)}

/* form header */
.formhead{display:flex;align-items:center;gap:12px;margin-top:12px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:16px;line-height:1}
.ring .n small{font-size:10px;font-weight:600;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin-top:6px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.lang button.on{background:var(--forest);color:#fff}
.weigh{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center}
.dial svg{width:150px;height:auto;display:block}
.dial .needle{transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:75px 78px}
.photo-box{border:2px dashed #b9c4bc;border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;background:#fafbf8;padding:12px;text-align:center;width:100%;font-weight:600}
.photo-box.sm{min-height:84px}
.photo-box svg{width:44px;height:44px}
.photo-box img{max-width:100%;max-height:230px;border-radius:10px}
.money-in{position:relative}
.money-in span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:18px}
.money-in input{padding-left:32px}

/* done */
.donescreen{text-align:center;padding-top:24px}
.donescreen .big{width:150px;height:150px;margin:0 auto}
.donescreen .big svg{width:150px;height:150px}
.donescreen .big .chk{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s ease-out forwards}
.donescreen .big .arc{animation:grow .8s ease-out}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{stroke-dashoffset:302}}

/* custody track */
.track{background:var(--forest);color:#fff;border-radius:var(--r-panel);padding:16px 12px 14px;margin:12px 0}
.track .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:0 4px 10px}
.track .st,.track .st .t{color:#fff}
.trk{display:grid;grid-template-columns:1fr 1fr 1fr;position:relative}
.trk .road{position:absolute;left:16.6%;right:16.6%;top:27px;height:6px;border-radius:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 10px,transparent 10px 18px)}
.trk .road i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--hivis);transition:width .8s ease}
.trk .seg{position:absolute;top:36px;font-size:11.5px;font-weight:700;transform:translateX(-50%);background:rgba(0,0,0,.25);padding:1px 7px;border-radius:999px;white-space:nowrap}
.trk .seg.bad{background:var(--red)}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.node .dot{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#24583c;border:3px solid rgba(255,255,255,.25)}
.node .dot svg{width:34px;height:34px}
.node.done .dot{background:#fff;border-color:var(--hivis)}
.node.now .dot{background:var(--saffron);border-color:#fff;animation:pulse 1.8s ease-out infinite}
.node.flag .dot{border-color:#ff8a80}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,150,42,.6)}100%{box-shadow:0 0 0 14px rgba(224,150,42,0)}}
.node .nm{font-size:12.5px;font-weight:700;margin-top:12px}
.node .w{font-family:var(--slab);font-size:19px;font-weight:700;line-height:1}
.node .w.pending{color:rgba(255,255,255,.45);font-size:14px;font-family:var(--sans)}
.track .truckline{margin:12px 4px 0;font-size:12.5px;color:#cfe3d6;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}

/* timeline */
.tl{position:relative;margin:6px 0 0 12px;padding-left:26px;border-left:3px dotted #b9c4bc}
.tl .ev{position:relative;margin:0 0 16px}
.tl .ev .pin{position:absolute;left:-46px;top:10px;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.tl .ev .pin svg{width:22px;height:22px}
.tl .ev.flag .pin{border-color:var(--red);background:var(--redSoft)}
.tl .ev .sheet{margin:0}
.tl img.ph{width:100%;max-width:320px;border-radius:12px;margin-top:10px;display:block;border:1px solid var(--line)}
.noph{margin-top:10px;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px;max-width:320px;display:flex;gap:10px;align-items:center}
.noph svg{width:34px;height:26px;flex:none;opacity:.6}

/* ---------- control room ---------- */
.cr{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}
.cr>*{min-width:0}
.crnav{position:sticky;top:64px;display:flex;flex-direction:column;gap:2px}
.crnav button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--ink);min-height:42px}
.crnav button:hover{background:#e6eae3}
.crnav button.on{background:var(--forest);color:#fff}
.crnav .cnt{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--redSoft);color:var(--red)}
.crnav button.on .cnt{background:#fff}
.crnav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
@media (max-width:860px){
  .cr{grid-template-columns:1fr;gap:6px}
  .crnav{position:sticky;top:50px;z-index:6;flex-direction:row;overflow-x:auto;background:var(--paper);padding:8px 0;margin:0 -16px;padding-left:16px;scrollbar-width:none}
  .crnav::-webkit-scrollbar{display:none}
  .crnav button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px}
  .crnav hr{display:none}
}
.crhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.crhead h1{margin:6px 0 0}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.alert .sev{background:var(--red)}
.alert.amber .sev{background:var(--saffron)} .alert.info .sev{background:var(--blue)}
.alert .bd{padding:10px 0}
.alert .bd b{display:block;font-size:15px}
.alert .bd .why{font-size:13.5px;color:var(--muted);margin-top:2px}
.alert .bd .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:6px;color:var(--ink)}
.alert .bd .meta span{display:inline-flex;gap:4px}
.alert .bd .meta em{font-style:normal;color:var(--muted)}
.alert .act{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 12px 10px 0}
@media (max-width:560px){.alert{grid-template-columns:6px 1fr}.alert .act{grid-column:2;flex-direction:row;padding:0 0 10px}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.filters label{font-size:12.5px;color:var(--muted);font-weight:700}
td .sel{min-width:170px}
.filters select,.filters input,.sel{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:14px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sheet);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:#f6f8f4;position:sticky;top:0;font-size:12.5px;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tr.click{cursor:pointer} tr.click:hover td{background:#f4f9f5}
tfoot td{font-weight:800;background:#f6f8f4}
@media (max-width:720px){
  .rt{border:0;background:transparent;overflow:visible}
  .rt table,.rt tbody,.rt tr,.rt td,.rt tfoot{display:block;width:100%}
  .rt thead{display:none}
  .rt tr{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px 0}
  .rt td{border:0;padding:4px 12px;display:flex;justify-content:space-between;gap:12px;white-space:normal;text-align:right}
  .rt td:before{content:attr(data-l);color:var(--muted);font-weight:600;text-align:left;font-size:12.5px}
  .rt td.lead{font-weight:700;justify-content:flex-start}
  .rt td.lead:before{display:none}
  .rt td:empty{display:none}
  .rt tfoot tr{background:#f6f8f4}
}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--casing);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pipe{display:flex;height:18px;border-radius:999px;overflow:hidden;gap:2px;margin:10px 0 8px;background:var(--paper)}
.pipe span{display:block;height:100%}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qrc{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.qrc.fresh{border:2px dashed var(--leaf)}
.qrc svg{width:100%;height:auto;max-width:140px}
.qrc .sticker{margin:6px 0}

/* how it works */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media (max-width:860px){.how{grid-template-columns:1fr}}
.scancol{background:#fff;border:1px solid var(--line);border-radius:var(--r-sheet);overflow:hidden}
.scancol .top{background:var(--forest);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
.scancol .top .n{width:40px;height:40px;border-radius:10px;background:var(--hivis);color:var(--casing);display:flex;align-items:center;justify-content:center;font-family:var(--slab);font-weight:700;font-size:22px;flex:none}
.scancol .top b{display:block;font-family:var(--slab);font-size:18px}
.scancol .top span{font-size:12.5px;color:#cfe3d6}
.stp{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.stp:first-of-type{border-top:0}
.stp .k{width:28px;height:28px;border-radius:50%;border:2px solid var(--forest);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--forest)}
.stp.scan .k{background:var(--hivis);border-color:var(--casing);color:var(--casing)}
.stp b{font-size:14.5px}
.stp .who3{font-size:12px;color:var(--muted);font-weight:700}
.stp p{margin:2px 0 0;font-size:13.5px;color:var(--ink)}
.stp .try{margin-top:6px}
.stp .try button{font-size:13px;padding:4px 10px;min-height:32px}

/* demo bar */
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:18;background:var(--casing);color:#fff;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.demobar .in{max-width:820px;margin:0 auto;padding:10px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.demobar .prog{grid-column:1/-1;display:flex;gap:4px;align-items:center}
.demobar .prog i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.demobar .prog i.d{background:var(--leaf)} .demobar .prog i.c{background:var(--hivis)}
.demobar .stepn{font-size:12.5px;color:#c8d0cc;font-weight:700;display:flex;gap:10px;align-items:center}

@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.overlay{background:rgba(12,24,17,.55);-webkit-backdrop-filter:none;backdrop-filter:none;animation:fade .15s ease both}
.modal{border-radius:10px;border:1px solid var(--line);box-shadow:var(--sh2);animation:pop .18s var(--ease) both}
.toast{background:var(--casing);-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ---- scan panel ---- */
.scanbtn{background:var(--casing);box-shadow:none;transition:none}
.scanbtn:hover{transform:none;box-shadow:none}
.scanbtn:after{display:none}

/* ---- landing: paper hero, roles in the first scroll ---- */
.landing{position:relative;isolation:auto;overflow:visible;margin:8px 0 0;padding:22px 0 20px;border-radius:0;color:var(--ink);background:transparent;box-shadow:none;border-bottom:1px solid var(--line)}
.landing .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--leaf);padding:0;background:none;border:0;animation:none}
.landing .eyebrow b{width:10px;height:10px;border-radius:2px;background:var(--hivis);box-shadow:none;animation:none}
.landing h1{margin:10px 0 10px;color:var(--ink);font-size:clamp(30px,7.6vw,42px);line-height:1.03;letter-spacing:-.035em;max-width:19ch;animation:none}
.landing h1 em{font-style:normal;color:var(--forest);background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:currentColor;position:relative;display:inline-block}
.landing h1 em:after{content:"";display:block;height:6px;margin-top:7px;background:var(--hivis);width:78%}
.landing p{margin:0 0 16px;color:var(--muted);font-size:16px;max-width:46ch;animation:none}
.landing .btn{width:auto;min-height:54px;padding:12px 22px;font-size:16.5px;white-space:nowrap;animation:none}
.landing .btn.hv:hover{transform:none}
.land-cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.land-meta{font-size:12.5px;color:var(--muted);font-weight:600}
.landing .steps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;padding:0;list-style:none;animation:none}
.landing .steps li{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--forest);padding:5px 10px 5px 5px;border-radius:4px;background:#fff;border:1px solid var(--line)}
.landing .steps li b{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:3px;background:var(--forest);color:var(--hivis);font-family:var(--slab);font-size:12px}
.roles-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 0}
.roles-head h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.roles-head span{font-size:12.5px;color:var(--muted)}

/* ---- role cards ---- */
.chain{gap:8px;margin-top:10px}
.stage{grid-template-columns:76px 1fr;gap:10px;align-items:start}
.stage .sn{display:flex;gap:7px;align-items:baseline;padding-top:6px}
.stage .sn b{font-family:var(--slab);font-size:12px;color:#8C8271;font-weight:700}
.stage .sn small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.chain.landing-chain .stage{grid-template-columns:1fr;gap:6px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;animation:none}
.chain.landing-chain .stage .sn{padding-top:0;display:flex;align-items:baseline;gap:9px}
.chain.landing-chain .stage .sn small{display:inline;margin-left:4px}
.whob{min-height:52px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:6px 10px 6px 6px;transition:border-color .12s,background .12s;box-shadow:none}
.whob:hover{border-color:var(--forest);background:#fff;transform:none;box-shadow:none}
.whob:active{transform:none}
.whob b{font-size:15px;font-variant-numeric:tabular-nums}
.whob span span{font-size:11.5px}
.whob.cur{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest);background:#fff}
.whob svg{width:30px;height:30px}
@media (min-width:760px){.chain{grid-template-columns:repeat(2,1fr);gap:10px}.chain.landing-chain{grid-template-columns:1fr}.chain.landing-chain .stage{grid-template-columns:96px 1fr}.chain.landing-chain .whob{flex:1 1 112px;min-width:0}.chain.landing-chain .stage .sn{display:block}.chain.landing-chain .stage .sn b{display:inline-block;margin-right:7px}.chain.landing-chain .stage .sn small{display:block;margin-left:0}}
@media (min-width:980px){.chain.landing-chain{grid-template-columns:1fr 1fr;align-content:start}.chain.landing-chain .stage{grid-template-columns:1fr}}
@media (min-width:700px){body.landing-on .wrap{max-width:900px}body.landing-on header.top .in{max-width:900px}}
@media (min-width:980px){.chain.landing-chain .stage:last-child .whob{flex:0 1 196px}}
@media (max-width:759px){.chain.landing-chain{grid-template-columns:1fr}}

/* ---- responsive shell: laptop measure, phone tap targets ---- */
@media (min-width:900px){
  .wrap{max-width:760px}
  header.top .in{max-width:760px}
}
@media (min-width:1200px){
  .wrap{max-width:820px}
  header.top .in{max-width:820px}
}
@media (max-width:560px){
  .hbtn{min-height:44px;padding:8px 10px}
  .crnav{top:60px}
  .link{min-height:44px}
  .filters select,.filters input,.sel{min-height:44px}
  .ev-more summary{min-height:44px;padding:9px 0}
  .btn.small{min-height:44px}
  .stp .try button{min-height:44px}
  .hbtn2{min-height:44px}
  .lang button{min-height:44px}
}

/* ---- sticky primary action on forms ---- */
@media (max-width:560px){
  #save,#repay{position:sticky;bottom:8px;z-index:6;box-shadow:0 -10px 18px var(--paper)}
}

/* ---- custody trail stage labels ---- */
.ev-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--forest);background:var(--leafSoft);border-radius:3px;padding:2px 6px;vertical-align:1px;margin-right:6px}
.demo-note{margin:0 0 10px;font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.ev-more{margin-top:8px;border-top:1px dashed #C9C0AC;padding-top:6px}
.ev-more summary{font-size:12.5px;font-weight:700;color:var(--forest);cursor:pointer;padding:6px 0;min-height:36px}
.ev-more .kv{margin-top:4px}
.result h3{margin:0 0 6px;font-size:14px;letter-spacing:.02em}
.tprog{margin:14px 0 4px}
.tpbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.tpbar i{display:block;height:100%;background:var(--forest);border-radius:4px}
.tprow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;margin-top:6px;font-size:11.5px;font-weight:700;color:#8C8271;letter-spacing:.04em;text-transform:uppercase}
.tprow .on{color:var(--forest)}
.empty{padding:24px 18px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--paper)}
.empty .e{font-size:26px;line-height:1;margin-bottom:6px}
.empty b{display:block;font-size:15px}
:lang(hi),.hi{line-height:1.65;letter-spacing:.015em}

/* ---- story / scan chrome ---- */
.cap{font-family:var(--slab)}
.story h1{letter-spacing:-.03em}
.phone{box-shadow:none;border:1px solid #1A2023}

@media (max-width:560px){
  header.top .in{padding-left:12px;gap:4px}
  .logo{font-size:19px;gap:5px}
  .logo svg{width:24px;height:24px}
  .hbtn{padding:6px 10px;gap:4px}
  .hd-actions{gap:4px}
  .landing{padding-top:16px}
  .landing h1{font-size:clamp(28px,8vw,34px)}
}
@media (max-width:380px){
  .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;justify-items:center}
  .flow .arr{display:none}
  .fl{width:auto}
  .clock{white-space:normal;flex-wrap:wrap}
  .logo{font-size:0;gap:0}
  .logo svg{width:26px;height:26px}
  .hbtn{padding:8px 8px;font-size:12.5px}
  header.top .in{padding-left:10px;padding-right:8px;gap:2px}
}
@media print{
  header.top,.demobar,.tourbar,.foot,#back,.toast{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .qrgrid{grid-template-columns:repeat(4,1fr);gap:6px}
  .qrc{break-inside:avoid;page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>

/* custody clock: bar fills toward the 10-day target, red past 90 */
function custodyMark(b){
  const d=custodyDays(b); if(d==null) return "";
  const col = d>STORAGE_LIMIT_DAYS?"var(--red)":d>TARGET_DAYS?"var(--saffron)":"var(--leaf)";
  const w = Math.min(100, d/TARGET_DAYS*100);
  const note = d>STORAGE_LIMIT_DAYS?"over the 90-day limit":d>TARGET_DAYS?"over the 10-day target":"within the 10-day target";
  return `<span class="clock" title="${d} days in custody, ${note}" style="color:${d>TARGET_DAYS?(d>STORAGE_LIMIT_DAYS?"var(--red)":"var(--saffronInk)"):"var(--ink)"}"><span class="bar" aria-hidden="true"><i style="width:${w}%;background:${col}"></i></span>${d} d${b.closedAt?"":" at yard"}</span>`;
}
function truckMark(b){ if(!b.truckId||b.status==="closed") return ""; return mk("info","truck","On truck "+((S.trucks.get(b.truckId)||{}).manifestNo||b.truckId)); }
function payStatusMark(p){
  if(p.kind==="deduction") return p.status==="recovered"?mk("neutral","minus","Recovered in "+(p.recoveredIn||"")):mk("warn","minus","Comes off next payout");
  return p.status==="paid"?mk("ok","check","Paid by UPI"):mk("warn","hold","Pending");
}
function settleStatus(s){ if(s.status==="repaid") return "repaid"; return new Date(s.dueAt)<new Date(new Date().toDateString()) ? "overdue" : "due"; }
function settleMark(s){ const st=settleStatus(s); return st==="repaid"?mk("ok","check","Repaid "+fmtDs(s.repaidAt)):st==="overdue"?mk("flag","clock","Overdue since "+fmtDs(s.dueAt)):mk("warn","clock","Due "+fmtDs(s.dueAt)); }
/* metric tile: number + what it is measured against */
function tile(o){
  const tag=o.go?"button":"div";
  const bar = o.bar ? `<div class="bullet" aria-hidden="true"><i style="width:${Math.min(100,o.bar.v/o.bar.max*100)}%;background:${o.bar.col||"var(--leaf)"}"></i>${o.bar.t!=null?`<b style="left:${Math.min(99,o.bar.t/o.bar.max*100)}%"></b>`:""}</div>` : "";
  return `<${tag} class="tilem ${o.tone||""}" ${o.go?`data-go="${esc(o.go)}"`:""}><span class="l">${esc(o.l)}</span><span class="v">${o.v}${o.u?`<small>${esc(o.u)}</small>`:""}</span>${bar}<span class="c">${o.c||""}</span></${tag}>`;
}
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
let _modalReturn=null;
function modal(html,wide){ _modalReturn=document.activeElement; $("#modalRoot").innerHTML = `<div class="overlay" id="ov"><div class="modal${wide?" wide":""}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`; const ov=$("#ov"); if(!ov) return; ov.addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); }); const m=ov.querySelector(".modal"), f=m.querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled]),a[href]'); try{ (f||m).focus(); }catch(e){} }
function closeModal(){ $("#modalRoot").innerHTML=""; try{ if(_modalReturn&&_modalReturn.isConnected) _modalReturn.focus(); }catch(e){} _modalReturn=null; }
const emptyHTML = (mark,title,body) => `<div class="empty"><div class="e">${mark}</div><b>${esc(title)}</b><p class="small muted" style="margin:4px 0 0">${esc(body)}</p></div>`;

/* every modal's close button is wired here, so no inline handler is needed */
document.addEventListener("click",e=>{ const c=e.target.closest("[data-close]"); if(c) closeModal(); });
/* Escape closes a dialog, Tab stays inside it, and Enter/Space opens a clickable row */
document.addEventListener("keydown",e=>{
  const ov=document.getElementById("ov");
  if(ov){
    if(e.key==="Escape"){ e.preventDefault(); closeModal(); return; }
    if(e.key!=="Tab") return;
    const f=[...ov.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
    if(!f.length){ e.preventDefault(); return; }
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    return;
  }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr.click[data-open],tr.click[data-settle]")){ e.preventDefault(); e.target.click(); }
});

/* ---------- DB ---------- */
const COLS = {batteries:"batteries",payouts:"payouts",truckloads:"trucks",settlements:"settlements",partners:"partners",audit:"audit",reviews:"reviews"};
/* Outside Claude (e.g. on Vercel) the page runs on a browser-local copy of the demo data */
const LOCAL_KEY="ll_store_v1";
function localDB(seed){
  let store={};
  try{ store=JSON.parse(localStorage.getItem(LOCAL_KEY)||"null")||null; }catch(e){ store=null; }
  if(!store){ store={}; for(const [c,docs] of Object.entries(seed)) for(const [id,d] of Object.entries(docs)) store[c+"/"+id]=d; }
  const persist=()=>{ try{ localStorage.setItem(LOCAL_KEY,JSON.stringify(store)); }catch(e){ if(!S.storeFull){ S.storeFull=true; try{ toast("This device is out of space: recent changes may not be kept."); }catch(x){} } } };
  persist();
  const subs=[];
  const snap=col=>({metadata:{fromCache:false},docs:Object.keys(store).filter(p=>p.split("/")[0]===col&&p.split("/").length===2).map(p=>({id:p.split("/")[1],exists:true,data:()=>JSON.parse(JSON.stringify(store[p]))}))});
  const fire=path=>subs.forEach(s=>{ if(s.col===path.split("/")[0]) setTimeout(()=>s.cb(snap(s.col)),0); if(s.doc===path) setTimeout(()=>s.cb({exists:true,data:()=>store[path]}),0); });
  window.addEventListener("storage",e=>{ if(e.key===LOCAL_KEY){ try{ store=JSON.parse(e.newValue)||store; }catch(x){} subs.forEach(s=>s.col?s.cb(snap(s.col)):s.cb({exists:!!store[s.doc],data:()=>store[s.doc]})); } });
  return {
    collection:col=>({onSnapshot:(cb)=>{ subs.push({col,cb}); setTimeout(()=>cb(snap(col)),0); return ()=>{}; }}),
    doc:path=>({ set:async d=>{ store[path]=JSON.parse(JSON.stringify(d)); persist(); fire(path); },
                 onSnapshot:(cb)=>{ subs.push({doc:path,cb}); setTimeout(()=>cb({exists:!!store[path],data:()=>store[path]}),0); return ()=>{}; } })
  };
}
function resetLocalData(){ try{ localStorage.removeItem(LOCAL_KEY); localStorage.removeItem("ll_demo"); }catch(e){} location.reload(); }
async function initLocal(){
  let seed=null;
  try{ seed=JSON.parse(document.getElementById("seedData").textContent); }catch(e){ seed=null; } // built-in copy first: no request on the critical path
  if(!seed){ try{ const r=await fetch("data/seed.json",{cache:"no-store"}); if(r.ok) seed=await r.json(); }catch(e){ seed=null; } } // optional external dataset
  if(!seed){ S.dbState="none"; render(); return; }
  S.local=true; S.db=localDB(seed);
  if(!S.downloads) S.downloads={save:async({filename,data})=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }};
  subscribeAll(S.db);
}
async function initDB(){
  let tries=0; const max=STANDALONE?0:50; // static hosting: never wait for window.claude
  while(!(window.claude&&window.claude.use) && tries<max){ await new Promise(r=>setTimeout(r,200)); tries++; }
  if(!(window.claude&&window.claude.use)) return initLocal();
  try{ S.downloads = await window.claude.use("downloads"); }catch(e){ S.downloads=null; }
  let db=null; try{ db = await window.claude.use("db"); }catch(e){ db=null; }
  if(!db) return initLocal(); // signed-out viewer of a shared link: run on this device's demo copy
  S.db=db; subscribeAll(db);
}
function subscribeAll(db){
  const timer=setTimeout(()=>{ if(S.dbState==="loading"){ S.dbState="slow"; render(); } },10000);
  Object.entries(COLS).forEach(([col,key])=>{
    db.collection(col).onSnapshot(snap=>{
      const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,d.data()); });
      S[key]=m;
      if(col==="batteries"){ clearTimeout(timer); if(S.dbState!=="ready"){ S.dbState="ready"; } }
      softRender();
    },err=>{ if(col==="batteries"){ clearTimeout(timer); S.dbState="error:"+(err&&err.code||"error"); render(); } });
  });
  db.doc("config/settings").onSnapshot(d=>{ if(d.exists) S.settings=Object.assign({weightThresholdPct:5},d.data()); softRender(); },()=>{});
}
// don't blow away a half-filled form on background updates
let _renderQueued=0;
/* snapshots arrive one per collection on load: fold them into a single render.
   A timeout rather than rAF, so a background tab still catches up. */
function softRender(){ if(_renderQueued) return; _renderQueued=setTimeout(()=>{ _renderQueued=0; if(["pickup","yard","dispatch"].includes(S.view)&&S.form){ renderDemo(); return; } if(S.view==="timeline"&&S.form&&S.form.weight){ renderDemo(); return; } render(); },16); }
async function saveDoc(path,data){
  if(!S.db) throw new Error("Database not available");
  let lastErr;
  for(let i=0;i<2;i++){
    try{ await S.db.doc(path).set(data); const [c,id]=path.split("/"); if(COLS[c]) S[COLS[c]].set(id,data); return; }
    catch(e){ lastErr=e; if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,500+Math.random()*700)); continue; } break; }
  }
  throw lastErr;
}
const saveBattery = (id,data) => saveDoc("batteries/"+id,data);
/* audit: every write the app makes leaves a line here */
async function audit(action,target,detail,extra){
  const id=rid("AU");
  const doc=Object.assign({id,at:new Date().toISOString(),by:S.user?S.user.id:"—",action,target,detail:detail||"",before:null,after:null,reason:null},extra||{});
  try{ await saveDoc("audit/"+id,doc); }catch(e){ /* audit is best-effort; the record itself was saved */ }
}
function errText(e){ return `Couldn't save (${esc(e&&e.code||e&&e.message||"error")}). ${e&&(e.code==="invalid_argument"||e.code==="permission_denied")?"Your account may not have write access to this page.":"Try again."}`; }

/* ---------- GPS ---------- */
function startGPS(){
  S.gpsResult = undefined;
  S.gpsPromise = new Promise(res=>{
    let done=false; const fin=v=>{ if(!done){done=true; S.gpsResult=v; res(v);} };
    try{
      if(!navigator.geolocation) return fin(null);
      navigator.geolocation.getCurrentPosition(
        p=>fin({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)}),
        ()=>fin(null), {enableHighAccuracy:true,timeout:8000,maximumAge:60000});
      setTimeout(()=>fin(null),9000);
    }catch(e){ fin(null); }
  });
}

/* ---------- images ---------- */
async function loadBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){
    return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
  }
}
async function compressPhoto(file,max=560,q=0.62){
  const bm = await loadBitmap(file);
  const w=bm.width,h=bm.height, s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
async function decodeQRFile(file){
  const bm = await loadBitmap(file);
  if("BarcodeDetector" in window){
    try{ const det=new BarcodeDetector({formats:["qr_code"]}); const r=await det.detect(bm); if(r&&r.length) return r[0].rawValue; }catch(e){}
  }
  if(typeof jsQR!=="function") throw new Error("QR decoder did not load");
  for(const max of [1200,800,1600,500]){
    const s=Math.min(1,max/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas"); c.width=Math.round(bm.width*s); c.height=Math.round(bm.height*s);
    const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(bm,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);
    const r=jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"});
    if(r&&r.data) return r.data;
  }
  return null;
}
function pickFile(inputId){
  return new Promise(res=>{
    const inp=$("#"+inputId); inp.value="";
    const on=()=>{ inp.removeEventListener("change",on); inp.removeEventListener("cancel",on); res(inp.files&&inp.files[0]||null); };
    inp.addEventListener("change",on); inp.addEventListener("cancel",on); inp.click();
  });
}
function svgQR(text,cell=4){
  if(typeof qrcode!=="function") return `<div class="muted small">QR library not loaded</div>`;
  const q=qrcode(0,"M"); q.addData(text); q.make();
  return q.createSvgTag({cellSize:cell,margin:2,scalable:true});
}

/* ---------- scanning ---------- */
function scanButtons(){
  return `<button class="scanbtn" id="bScan"><span class="vf">${ICON.viewfinder()}</span><span>Scan battery QR</span><small>Opens your camera. Take a photo of the sticker.</small></button>
  <button class="btn ghost" id="bSim">Simulate a scan with a demo ID</button>`;
}
function wireScan(){
  $("#bScan").onclick=async()=>{
    startGPS(); S.scanAt=Date.now();
    const f=await pickFile("fileScan"); if(!f) return;
    const bs=$("#bScan"); bs.classList.add("busy"); bs.querySelector("span:nth-child(2)").textContent="Reading the QR…";
    let txt=null; try{ txt=await decodeQRFile(f); }catch(e){ txt=null; }
    let m=null; try{ m = txt && decodeURIComponent(txt).toUpperCase().match(ID_RE); }catch(e){ m=null; }
    if(!m){ render(); modal(`<h2>Couldn't read the QR</h2><p>Hold the phone 15–25 cm from the sticker, keep it flat and in focus, and try again. Or simulate the scan with a demo ID.</p><button class="btn" data-close>Try again</button>`); return; }
    routeBattery(m[0]);
  };
  $("#bSim").onclick=()=>{ startGPS(); S.scanAt=Date.now(); simulatePicker(); };
}
function fitsRole(b){
  const r=S.user.role;
  if(r==="vendor"||r==="dealer") return b.status==="unused";
  if(r==="yard") return b.status==="picked_up";
  if(r==="recycler") return b.status==="at_yard"&&b.truckId&&(S.trucks.get(b.truckId)||{}).recyclerId===S.user.id;
  return true;
}
function simulatePicker(){
  const all=[...S.batteries.values()].sort((a,b)=>a.id.localeCompare(b.id));
  const sug=all.filter(fitsRole), rest=all.filter(b=>!fitsRole(b));
  const btn=b=>`<button class="chip" data-sim="${esc(b.id)}" style="flex:0 1 auto;min-width:0;min-height:44px">${esc(b.id)}</button>`;
  modal(`<h2>Simulate a scan</h2>
   <p class="small muted">Stickers that fit your role right now</p><div class="chips">${sug.map(btn).join("")||'<span class="muted small">None right now</span>'}</div>
   <details style="margin-top:14px"><summary class="small muted">Other stickers, to see what gets blocked</summary><div class="chips" style="margin-top:8px">${rest.map(btn).join("")}</div></details>
   <label class="f" for="simId">Or type an ID</label><div class="row"><input class="t" id="simId" placeholder="LL-0021"><button class="btn small" id="simGo" style="margin:0;min-height:54px">Open</button></div>
   <button class="btn ghost" data-close>Cancel</button>`);
  document.querySelectorAll("[data-sim]").forEach(b=>b.onclick=()=>{ closeModal(); routeBattery(b.dataset.sim); });
  $("#simGo").onclick=()=>{ const v=($("#simId").value||"").toUpperCase().match(ID_RE); closeModal(); if(v) routeBattery(v[0]); else modal(`<h2>Not a LeadLoop ID</h2><p>IDs look like LL-0021.</p><button class="btn" data-close>OK</button>`); };
}
/* decides what a battery opens for the current role; quiet = no blocking pop-ups (role switch, deep link, demo) */
function routeBattery(id,opt){
  const quiet=opt&&opt.quiet;
  const b=S.batteries.get(id), role=S.user.role;
  const stop=html=>{ if(quiet){ S.view="timeline"; render(); } else modal(html+`<button class="btn" data-close>OK</button>`); };
  if(!b){ if(!quiet) modal(`<h2>Not a LeadLoop sticker</h2><p>${sticker(id,1)} is not in the sticker registry.</p><button class="btn" data-close>OK</button>`); else go(homeOf()); return; }
  S.id=id; S.form=null;
  if(!S.scanAt||quiet) S.scanAt=Date.now();
  if(role==="vendor"||role==="dealer"){
    if(b.status!=="unused") return stop(`<h2>Sticker already used</h2><p>${sticker(id,1)} is already on a battery (${esc(STATUS[b.status])}). One QR is one battery, so a sticker can never be reused.</p>`);
    if(quiet&&!S.gpsPromise) startGPS();
    S.form={source:"",brand:"",vehicle:"",died:"",weight:"",photo:null,label:null,leaking:null,paid:"",upi:"",sale:""};
    S.view="pickup"; return render();
  }
  if(role==="yard"){
    if(b.status==="picked_up"){ S.form={weight:"",photo:null,condition:"",upi:demoUpi()}; S.view="yard"; return render(); }
    if(b.status==="unused") return stop(`<h2>Not picked up yet</h2><p>${sticker(id,1)} has no pickup record, so it can't be weighed in at the yard.</p>`);
    S.view="timeline"; return render();
  }
  if(role==="recycler"){
    if(b.status==="unused") return stop(`<h2>No custody record</h2><p>${sticker(id,1)} has not been picked up.</p>`);
    S.form={weight:""}; S.view="timeline"; return render();
  }
  S.view="timeline"; render();
}

async function savePickup(){
  const L=T[S.lang], f=S.form, dealer=S.user.role==="dealer";
  const w=parseFloat(f.weight), paid=parseFloat(f.paid), upi=(f.upi||"").trim();
  const miss=[];
  if(!f.source) miss.push(L.source);
  if(!f.brand) miss.push(L.brand);
  if(!f.died) miss.push(L.died);
  if(!(w>0&&w<500)) miss.push(L.weight);
  if(!f.photo) miss.push(L.photo);
  if(!f.label) miss.push(L.label);
  if(!f.leaking) miss.push(L.leaking);
  if(!dealer&&!(paid>0)) miss.push(L.paid);
  if(!dealer&&upi.length<6) miss.push(L.upi);
  if(!f.sale) miss.push(dealer?L.saleT:L.sale);
  if(miss.length){ $("#formErr").innerHTML=`<div class="banner err">${esc(L.need)} ${miss.map(esc).join(", ")}</div>`; return; }
  const btn=$("#save"); btn.disabled=true; btn.textContent="…";
  const cur=S.batteries.get(S.id);
  if(!cur||cur.status!=="unused"){ modal(`<h2>Sticker already used</h2><p>Someone registered ${esc(S.id)} a moment ago.</p><button class="btn" data-close>OK</button>`); go("home"); return; }
  const gps = S.gpsResult===undefined ? await Promise.race([S.gpsPromise||Promise.resolve(null),new Promise(r=>setTimeout(()=>r(null),1500))]) : S.gpsResult;
  const at=new Date().toISOString(), dur=Math.round((Date.now()-S.scanAt)/1000), sale=+f.sale;
  const payF = dealer ? {exchange:true} : {paidToDriverInr:paid,driverUpiRef:upi};
  const ev={type:dealer?"dealer_takeback":"pickup",at,by:S.user.id,role:S.user.role,gps:gps||null,kg:w,photo:f.photo,labelPhoto:f.label||null,
    source:f.source,brand:f.brand,vehicleMasked:maskVehicle(f.vehicle),diedWhen:f.died,leaking:f.leaking==="yes",durationSec:dur,batteriesInSale:sale,...payF};
  const nb=Object.assign(clone(cur),{status:"picked_up",channel:dealer?"dealer":"vendor",source:f.source,brand:f.brand,vehicleMasked:maskVehicle(f.vehicle),diedWhen:f.died,leaking:f.leaking==="yes",
    pickupKg:w,pickedUpBy:S.user.id,pickedUpAt:at,pickupGps:gps||null,batteriesInSale:sale,...payF,flagged:false,flags:[],events:[...(cur.events||[]),ev],updatedAt:at});
  try{ await saveBattery(S.id,nb); }
  catch(e){ btn.disabled=false; btn.textContent=dealer?L.submitT:L.submit; $("#formErr").innerHTML=`<div class="banner err">${errText(e)}</div>`; return; }
  audit(dealer?"Take-back logged":"Pickup logged",S.id,dealer?`${kg(w)}, exchange at ${S.user.id}`:`${kg(w)}, ${inr(paid)} paid to the driver (UPI ${upi})`);
  S.done={id:S.id,dur,kind:"pickup"}; S.form=null; S.view="done"; render();
}

async function saveYard(){
  const f=S.form, t=thr();
  const w=parseFloat(f.weight), miss=[];
  if(!(w>0)) miss.push("weight"); if(!f.photo) miss.push("photo"); if(!f.condition) miss.push("condition"); if((f.upi||"").trim().length<6) miss.push("UPI reference");
  if(miss.length){ $("#formErr").innerHTML=`<div class="banner err">Please add: ${miss.join(", ")}</div>`; return; }
  const cur=S.batteries.get(S.id); if(!cur){ toast("That record is no longer here. Reload to continue."); return go("home"); } if(cur.status!=="picked_up"){ modal(`<h2>Already received</h2><button class="btn" data-close>OK</button>`); return; }
  $("#save").disabled=true;
  if(!S.gpsPromise) startGPS();
  const gps=await Promise.race([S.gpsPromise,new Promise(r=>setTimeout(()=>r(null),1500))]);
  const at=new Date().toISOString(), p=(w-cur.pickupKg)/cur.pickupKg*100, bad=Math.abs(p)>t;
  const flags=[...(cur.flags||[])];
  if(bad) flags.push({type:"weight_mismatch",stage:"yard",at,baseKg:cur.pickupKg,newKg:w,diffPct:+p.toFixed(1),thresholdPct:t});
  const payee=cur.channel==="dealer"?(f.collector||DEALER_COLLECTOR[S.user.id]):cur.pickedUpBy;
  const deds=pendingDeductions(payee), gross=Math.round(vendorPayout(w)), dsum=deds.reduce((a,d)=>a+d.amount,0);
  const pid=rid("PO");
  const po={id:pid,kind:"payout",vendorId:payee,batteryId:cur.id,yardId:S.user.id,recyclerId:S.user.recycler,kg:w,rate:RATE,gross,
    deductions:deds.map(d=>({id:d.id,amount:d.amount,batteryId:d.batteryId})),net:Math.max(0,gross-dsum),upiRef:f.upi.trim(),status:"paid",at,by:S.user.id};
  const ev={type:"yard_receipt",at,by:S.user.id,role:"yard",gps:gps||null,kg:w,photo:f.photo,condition:f.condition,diffPct:+p.toFixed(1),flagged:bad,payoutId:pid};
  const nb=Object.assign(clone(cur),cur.channel==="dealer"?{deliveredBy:payee}:{},{status:"at_yard",yardId:S.user.id,recyclerId:S.user.recycler,yardKg:w,yardAt:at,condition:f.condition,payoutId:pid,flagged:flags.length>0,flags,events:[...(cur.events||[]),ev],updatedAt:at});
  try{ await saveBattery(S.id,nb); await saveDoc("payouts/"+pid,po); }
  catch(e){ $("#save").disabled=false; $("#formErr").innerHTML=`<div class="banner err">${errText(e)}</div>`; return; }
  for(const d of deds){ try{ await saveDoc("payouts/"+d.id,Object.assign(clone(d),{status:"recovered",recoveredIn:pid,recoveredAt:at})); audit("Deduction recovered",d.id,`${inr(d.amount)} netted from ${pid}`); }catch(e){} }
  audit("Weighed in and paid",S.id,`${kg(w)} (${p>=0?"+":""}${p.toFixed(1)}% vs pickup), ${pid} ${inr(po.net)} to ${payee}, UPI ${po.upiRef}`);
  S.done={id:S.id,kind:"yard",payoutId:pid,msg:`Weighed in at ${S.user.label}. ${payee} paid ${inr(po.net)} by UPI.`,flagMsg:bad?`Flagged: weight differs by ${p.toFixed(1)}% from pickup (threshold ±${t}%).`:""};
  S.form=null; S.view="done"; render();
}

/* custody track: 3 scans with weights and the gaps between them */
function trackHTML(b){
  const t=thr();
  const st=b.status, stage = SCANS[st]||0;
  const yf=(b.flags||[]).some(f=>(f.stage||"yard")==="yard"), gf=(b.flags||[]).some(f=>f.stage==="gate");
  const p1=pct(b.pickupKg,b.yardKg), p2=pct(b.yardKg,b.recyclerKg);
  const node=(i,icon,name,w,flag)=>`<div class="node ${i<=stage?"done":i===stage+1?"now":""} ${flag?"flag":""}"><div class="dot">${icon}</div><div class="nm"><span class="nn">0${i}</span>${name}</div><div class="w ${w==null?"pending":""}">${w==null?"waiting":kg1(w)+"<small style='font-size:12px'> kg</small>"}</div></div>`;
  const fill = stage<=0?0:stage===1?25:stage===2?(b.truckId?75:50):100;
  const seg=(left,p,bad)=>p==null?"":`<div class="seg ${bad?"bad":""}" style="left:${left}%">${p>=0?"+":""}${p.toFixed(1)}%</div>`;
  const tr=b.truckId&&S.trucks.get(b.truckId);
  return `<div class="track"><div class="head">${sticker(b.id)}<span class="row" style="gap:8px">${statusMark(st)}<span class="tol">±${t}% at each check</span></span></div>
   <div class="trk"><div class="road"><i style="width:${fill}%"></i></div>
    ${node(1,b.channel==="dealer"?ICON.dealer():ICON.vendor(),b.channel==="dealer"?"Dealer take-back":"Pickup",b.pickupKg,false)}
    ${node(2,ICON.yard(),"Yard weigh-in",b.yardKg,yf)}
    ${node(3,ICON.recycler(),"Recycler gate",b.recyclerKg,gf)}
    ${seg(33.3,p1,p1!=null&&Math.abs(p1)>t)}${seg(66.6,p2,p2!=null&&Math.abs(p2)>t)}
   </div>
   <div class="truckline">${tr?`${ICN.truck.replace('viewBox','width="16" height="16" viewBox')} ${esc(tr.manifestNo)}, truck ${esc(tr.truckNo)}, ${fmtDs(tr.dispatchedAt)}`:`Weights must match within ±${t}% at each check`}</div></div>`;
}

const EV_TITLE={pickup:"Picked up by scrap vendor",dealer_takeback:"Taken back by dealer at exchange",yard_receipt:"Weighed in at LeadLoop yard and partner paid",dispatch:"Loaded onto the recycler's truck",recycler_receipt:"Gate check at the recycler, record closed",correction:"Record corrected by LeadLoop"};

function diffBanner(base,w,t,baseLabel,newLabel,consequence){
  if(!(w>0)||!base) return "";
  const p=(w-base)/base*100, bad=Math.abs(p)>t;
  return `<div class="banner ${bad?"err":"ok"}">${baseLabel} ${kg(base)}, ${newLabel} ${kg(w)}: <b>${p>=0?"+":""}${p.toFixed(1)}%</b>, ${bad?`over ±${t}%, so the ${consequence}`:`within ±${t}%`}</div>`;
}
function timelineHTML(b){
  const evs=[...(b.events||[])].sort((a,c)=>a.at.localeCompare(c.at));

  return `${anyPhoto?"":`<p class="demo-note">Demo records: photos appear on entries recorded in the app.</p>`}<div class="tl">${evs.map(e=>{
    const rows=[["Who",userLabel(e.by)],["When",fmtDT(e.at)]];
    if(e.gps!==undefined) rows.push(["Where",gpsText(e.gps)]);
    if(e.kg!=null) rows.push(["Weight",kg(e.kg)]);
    if(e.type==="pickup"||e.type==="dealer_takeback"){
      rows.push(["Source",T.en.src[e.source]||e.source||"—"]);
      if(e.brand) rows.push(["Brand",T.en.brandO[e.brand]||e.brand]);
      if(e.vehicleMasked) rows.push(["Vehicle",e.vehicleMasked]);
      rows.push(["Died",T.en.diedO[e.diedWhen]||e.diedWhen||"—"],["Leaking",e.leaking?"Yes":"No"]);
      if(e.paidToDriverInr) rows.push(["Paid to driver",`${inr(e.paidToDriverInr)}, UPI ${e.driverUpiRef||"—"}`]);
      if(e.type==="dealer_takeback") rows.push(["Exchange",`Credited against the new battery; ₹${ALLOWANCE} tagging fee to ${e.by}`]);
      if(e.batteriesInSale) rows.push([e.type==="dealer_takeback"?"Batteries exchanged":"Batteries in this sale",String(e.batteriesInSale)]);
      if(e.durationSec!=null) rows.push(["Logged in",e.durationSec+" s"]);
    }
    if(e.type==="yard_receipt"){
      if(b.deliveredBy) rows.push(["Brought in by",userLabel(b.deliveredBy)]);
      rows.push(["Condition",e.condition||"—"]);
      if(e.diffPct!=null) rows.push(["vs pickup",(e.diffPct>=0?"+":"")+e.diffPct+"%"]);
      const po=S.payouts.get(e.payoutId||b.payoutId);
      rows.push(["Partner paid",po?`${inr(po.net)} by UPI ${po.upiRef} (${po.id})`:`${inr(vendorPayout(e.kg))} (₹${RATE}/kg)`]);
    }
    if(e.type==="dispatch") rows.push(["Manifest",e.manifestNo],["Truck",e.truckNo]);
    if(e.type==="recycler_receipt"){
      if(e.diffPct!=null) rows.push(["vs yard",(e.diffPct>=0?"+":"")+e.diffPct+"%"]);
      rows.push(["Recycler repays",`${inr(vendorPayout(b.yardKg||0))} + fee ${inr(FEE_PER_KG*e.kg)}, within ${REPAY_DAYS} days`]);
    }
    if(e.type==="correction") rows.push(["Field",e.field],["Was",e.before],["Now",e.after],["Reason",e.reason]);
    const showPhoto = ["pickup","dealer_takeback","yard_receipt"].includes(e.type);
    const pinIcon={pickup:ICON.vendor(),dealer_takeback:ICON.dealer(),yard_receipt:ICON.yard(),recycler_receipt:ICON.recycler(),dispatch:`<span style="color:${C.forest};display:flex">${ICN.truck.replace('viewBox','width="20" height="20" viewBox')}</span>`,correction:ICON.admin()}[e.type]||ICON.battery();
    const MAIN=new Set(["Who","When","Weight","Manifest","Paid to driver","Partner paid","vs pickup","vs yard","Recycler repays"]);
    const main=rows.filter(r=>MAIN.has(r[0])).slice(0,4);
    const rest=rows.filter(r=>!main.includes(r));
    return `<div class="ev ${e.flagged?"flag":""}"><span class="pin">${pinIcon}</span><div class="sheet">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px"><b><span class="ev-chip">${EV_CHIP[e.type]||"Record"}</span>${esc(EV_TITLE[e.type]||e.type)}</b>${e.flagged?mk("flag","tri","Weight flag"):""}</div>
      <dl class="kv">${main.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
      ${showPhoto&&e.photo?`<img class="ph" src="${esc(e.photo)}" alt="Photo at this step">`:""}
      ${e.labelPhoto?`<img class="ph" src="${esc(e.labelPhoto)}" alt="Label photo">`:""}
      ${rest.length?`<details class="ev-more"><summary>Full record (${rest.length})</summary><dl class="kv">${rest.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></details>`:""}
    </div></div>`; }).join("")}</div>`;
}
function flagsHTML(b){

  }).join("");

  app.innerHTML = `${slowNote()}${backBtn(tr&&S.ref===tr.id?"Back to the truckload":"Back")}

async function saveGate(id){
  const w=parseFloat(S.form.weight); if(!(w>0)){ $("#formErr").innerHTML=`<div class="banner err">Enter your weight.</div>`; return; }
  const cur=S.batteries.get(id); if(!cur||cur.status!=="at_yard"){ render(); return; }
  $("#close").disabled=true;
  const t=thr();
  startGPS(); const gps=await Promise.race([S.gpsPromise,new Promise(r=>setTimeout(()=>r(null),1500))]);
  const at=new Date().toISOString(), p=cur.yardKg?+((w-cur.yardKg)/cur.yardKg*100).toFixed(1):null, bad=p!=null&&Math.abs(p)>t;
  const flags=[...(cur.flags||[])];
  if(bad) flags.push({type:"weight_mismatch",stage:"gate",at,baseKg:cur.yardKg,newKg:w,diffPct:p,thresholdPct:t});
  const ev={type:"recycler_receipt",at,by:S.user.id,role:"recycler",gps:gps||null,kg:w,diffPct:p,flagged:bad,truckId:cur.truckId};
  const nb=Object.assign(clone(cur),{status:"closed",recyclerKg:w,closedAt:at,flagged:flags.length>0,flags,events:[...(cur.events||[]),ev],updatedAt:at});
  try{ await saveBattery(id,nb); }catch(e){ $("#close").disabled=false; $("#formErr").innerHTML=`<div class="banner err">${errText(e)}</div>`; return; }
  audit("Gate check, record closed",id,`${kg(w)} (${p>=0?"+":""}${p}% vs yard)${bad?", flagged":""}`);
  // gap over threshold with less lead than paid for: comes off the partner's next payout
  if(bad && w<cur.yardKg){
    const did=rid("DD"), amt=Math.round(RATE*(cur.yardKg-w));
    const dd={id:did,kind:"deduction",vendorId:partnerOf(cur),batteryId:id,truckId:cur.truckId,kgGap:Math.round((cur.yardKg-w)*10)/10,amount:amt,diffPct:p,
      reason:`Gate weight ${kg1(w)} kg vs yard ${kg1(cur.yardKg)} kg (${p}%), over the ±${t}% threshold`,status:"pending",at};
    try{ await saveDoc("payouts/"+did,dd); audit("Deduction raised",did,`${inr(amt)} from ${partnerOf(cur)}'s next payout (${id} gate gap ${p}%)`); }catch(e){}
  }
  // last battery on the truck: mark it received and issue the settlement statement
  const tr=cur.truckId&&S.trucks.get(cur.truckId);
  let msg=bad?"Record closed and flagged at the gate":"Record closed";
  if(tr){
    const bs=tr.batteryIds.map(i=>S.batteries.get(i));
    if(bs.every(x=>x&&x.status==="closed")&&!tr.settlementId){
      const sid=rid("ST");
      const lines=bs.map(x=>{ const po=S.payouts.get(x.payoutId)||{gross:Math.round(vendorPayout(x.yardKg))};
        return {batteryId:x.id,vendorId:partnerOf(x),yardKg:x.yardKg,recyclerKg:x.recyclerKg,vendorPaid:po.gross,fee:Math.round(FEE_PER_KG*x.recyclerKg*100)/100,diffPct:+pct(x.yardKg,x.recyclerKg).toFixed(1),flagged:(x.flags||[]).some(f=>f.stage==="gate")}; });
      const vp=lines.reduce((a,l)=>a+l.vendorPaid,0), fee=Math.round(lines.reduce((a,l)=>a+l.fee,0)*100)/100;
      const deds=[...S.payouts.values()].filter(d=>d.kind==="deduction"&&d.truckId===tr.id).map(d=>({id:d.id,vendorId:d.vendorId,batteryId:d.batteryId,amount:d.amount}));
      const s={id:sid,truckId:tr.id,manifestNo:tr.manifestNo,yardId:tr.yardId,recyclerId:tr.recyclerId,lines,vendorPayments:vp,fee,total:Math.round((vp+fee)*100)/100,
        gateCheckedAt:at,dueAt:new Date(Date.now()+REPAY_DAYS*dayMs).toISOString(),status:"due",deductions:deds,createdAt:at};
      try{ await saveDoc("settlements/"+sid,s); await saveDoc("truckloads/"+tr.id,Object.assign(clone(tr),{status:"received",receivedAt:at,settlementId:sid})); }catch(e){}
      audit("Settlement issued",sid,`${tr.manifestNo}: ${inr2(s.total)} due ${fmtD(s.dueAt)}`);
      msg="Truckload complete. Settlement "+sid+" issued";
    }
  }
  S.form=null; toast(msg);
  if(tr){ S.ref=tr.id; go("truck",tr.id); } else render();
}

/* ---------- LeadLoop control room ---------- */
function alertsList(){
  const A=[], all=[...S.batteries.values()];
  const add=a=>{ a.reviewed=S.reviews.get(a.key.replace(/[\/:]/g,"_"))||null; A.push(a); };
  for(const b of all){
    for(const f of (b.flags||[])){

function monthly(){

function cpcbRows(month){

    const yb=all.filter(b=>b.yardId===y);
    const inM=(iso)=>iso&&iso>=start&&iso<endIso;
    const opening=yb.filter(b=>b.yardAt<start&&!(b.dispatchedAt&&b.dispatchedAt<start));
    const recv=yb.filter(b=>inM(b.yardAt)), sent=yb.filter(b=>inM(b.dispatchedAt)), gate=yb.filter(b=>inM(b.closedAt));
    const closing=yb.filter(b=>b.yardAt<endIso&&!(b.dispatchedAt&&b.dispatchedAt<endIso));

    return {centre:y,recycler:userById(y).recycler,openingN:opening.length,openingKg:s(opening),recvN:recv.length,recvKg:s(recv),sentN:sent.length,sentKg:s(sent),gateKg:Math.round(gate.reduce((x,b)=>x+(b.recyclerKg||0),0)*10)/10,closingN:closing.length,closingKg:s(closing),maxDays:stored.length?Math.max(...stored):0,over90:stored.filter(d=>d>STORAGE_LIMIT_DAYS).length,flags:recv.filter(b=>b.flagged).length+gate.filter(b=>(b.flags||[]).some(f=>f.stage==="gate")).length,leaking:recv.filter(b=>b.leaking||b.condition==="Leaking").length};

const STORY_MS = 43000;

  try{ const vs=speechSynthesis.getVoices()||[]; const want=lang==="hi"?["hi-IN","hi"]:["en-IN","en-GB","en-US","en"];
    for(const w of want){ const v=vs.find(v=>(v.lang||"").toLowerCase().startsWith(w.toLowerCase())); if(v) return v; } }catch(e){}

/* Hard stop so a throttled tab (timers clamped to ~1 s) still lands under 45 s */
function storyGuard(){ clearTimeout(ST.guard); if(!ST.playing||!ST.deadline) return;
  const left=Math.max(0,ST.deadline-Date.now());
  ST.guard=setTimeout(()=>{ if(ST.playing) storyFinish(); }, left+40); }

function storyBeat(i){
  clearTimeout(ST.timer); const token=++ST.token; try{ if(canSpeak()) speechSynthesis.cancel(); }catch(e){}
  ST.i=Math.max(0,Math.min(BEATS.length-1,i)); ST.ended=false;
  if(S.view==="story") renderStoryStage();
  if(!ST.playing) return;
  if(!ST.deadline) ST.deadline=Date.now()+STORY_MS;
  storyGuard();
  const b=BEATS[ST.i], txt=b[ST.lang], started=Date.now();
  const left=Math.max(700,ST.deadline-started), cap=Math.max(650,left/Math.max(1,BEATS.length-ST.i)-420);
  const minMs=Math.min(ST.lang==="hi"?3400:3000, cap);
  const next=()=>{ if(!ST.playing) return; if(Date.now()>=ST.deadline-150) return storyFinish();
    const wait=Math.max(120,Math.min(cap,Math.max(0,minMs-(Date.now()-started))+200));
    ST.timer=setTimeout(()=>{ if(!ST.playing) return; if(ST.i<BEATS.length-1) storyBeat(ST.i+1); else storyFinish(); },wait); };
  const voice = ST.sound && canSpeak() && !ST.voiceBlocked ? pickVoice(ST.lang) : null;
  const note=$("#stNote");
  if(note){ if(ST.voiceBlocked){ storyVoicePrompt(); } else { note.textContent = ST.sound && canSpeak() && !voice ? (ST.lang==="hi"?"This device has no Hindi voice installed, so Hindi plays as captions. Switch to EN for the voice.":"This device has no English voice installed, so the story plays as captions.") : ""; } }
  if(voice){
    try{ const u=new SpeechSynthesisUtterance(txt.replace(/₹/g, ST.lang==="hi"?"रुपये ":"rupees ")); u.voice=voice; u.lang=ST.lang==="hi"?"hi-IN":"en-IN"; u.rate=1.5;
      let done=false, began=false;
      const fin=()=>{ if(done||token!==ST.token) return; done=true; clearTimeout(watch); next(); };
      const watch=setTimeout(()=>{ if(!done&&!began&&token===ST.token){ ST.voiceBlocked=true; storyVoicePrompt(); } },1400);
      u.onstart=()=>{ began=true; clearTimeout(watch); };
      u.onend=fin;
      u.onerror=()=>{ if(!began&&token===ST.token){ ST.voiceBlocked=true; storyVoicePrompt(); } fin(); };
      ST.timer=setTimeout(fin, Math.min(Math.max(minMs, txt.length*80), Math.max(700,left-250))); // fallback if the browser never fires onend
      speechSynthesis.speak(u); return; }catch(e){}
  }
  ST.timer=setTimeout(next, 0);
}
function storyPhone(i){
  const rows=a=>a.map(([k,v,c])=>`<div class="ph-row"><span>${k}</span><b ${c?`style="color:${c}"`:""}>${v}</b></div>`).join("");
  const app=(who,ic,title,body)=>`<div class="ph-app"><div class="ph-bar">${ICON.logo()}<b>LeadLoop</b><span>${who}</span></div><div class="ph-body"><div class="ph-stk">${ICON.qr()}LL-0021</div><div class="ph-title">${ic}${title}</div>${body}</div></div>`;
  const ok=`<span class="ph-ok">${ICN.check}</span>`;
  switch(i){
    case 0: return `<div class="ph-app"><div class="ph-bar upi"><b>UPI</b><span>Paid</span></div><div class="ph-body ph-done"><div class="ph-check">${ICN.check}</div><b style="font-size:22px">₹1,830</b><small>to the driver · UPI ref 4123 9876 5432</small><div class="ph-row" style="width:100%"><span>Local rate</span><b>₹60–62/kg</b></div><div class="ph-row" style="width:100%"><span>Time to pay</span><b>under 15 min</b></div></div></div>`;
    case 1: return app("V-101",ICON.vendor(),"Battery pickup",`<div class="ph-lang"><i class="on">EN</i><i>हिंदी</i></div>`+rows([["Source","E-rickshaw"],["Weight","30.2 kg"],["Photo + label","✓ ✓"],["Paid to driver","₹1,830 UPI"]])+`<div class="ph-btn">Save pickup · 52 s</div>`);
    case 2: return app("Y-02",ICON.yard(),"Yard weigh-in",rows([["Pickup","30.2 kg"],["Yard","30.0 kg"],["Difference","−0.7% ✓",C.forest]])+`<div class="ph-pay"><span>Pay V-101 today</span><b>₹2,070</b><small>₹67 + ₹2 match × 30 kg · UPI</small></div>`);
    case 3: return `<div class="ph-app"><div class="ph-bar">${ICON.logo()}<b>LeadLoop</b><span>Y-02</span></div><div class="ph-body"><div class="ph-slip"><small>Manifest</small><b>MF-Y02-261122</b><small>Y-02 → recycler R-302 · truck DL 1L AB 4021</small></div>${["LL-0021","LL-0009","LL-0013"].map(x=>`<div class="ph-row"><span>${ICON.qr()} ${x}</span><b>loaded ${ICN.check}</b></div>`).join("")}<div class="ph-btn">Dispatch truckload</div></div></div>`;
    case 4: return app("R-302",ICON.recycler(),"Gate check",rows([["Yard","30.0 kg"],["Gate","29.9 kg"],["Difference","−0.3% ✓",C.forest]])+`<div class="ph-block">${ICN.tri} Over ±5%? Record flagged; the gap comes off the partner's next payment</div>`);
    case 5: return `<div class="ph-app"><div class="ph-bar">${ICON.logo()}<b>LeadLoop</b><span>R-302</span></div><div class="ph-body"><div class="ph-slip"><small>Settlement statement</small><b>₹2,190</b><small>due 10 days after the gate check</small></div>${rows([["Partner paid by LeadLoop","₹2,070"],["LeadLoop fee ₹4/kg","₹120"],["Recycler repays","₹2,190"]])}</div></div>`;
    case 6: return `<div class="ph-app"><div class="ph-bar">${ICON.logo()}<b>Control room</b><span>A-01</span></div><div class="ph-body">${[["red","Weight gap −12% at yard","LL-0012 · owner Y-01"],["amber","16 days at yard, target 10","LL-0011 · owner Y-02"],["amber","No yard scan for 10 days","LL-0017 · owner D-201"],["info","Monthly report ready","CPCB filing CSV"]].map(([c,a,b])=>`<div class="ph-alert ${c}"><b>${a}</b><small>${b}</small></div>`).join("")}</div></div>`;
    default: return `<div class="ph-field">${[["👆","Big buttons","one thumb, gloves on"],["अ","Hindi or English","switch any time"],["📷","Photos, not typing","weight, label, scale"],["⏱","Under 90 s","per battery"],["📱","Any phone camera","no app to install"],["✓","Can't be reused","one QR, one battery"]].map(([e,a,b])=>`<div><span class="em">${e}</span><b>${a}</b><small>${b}</small></div>`).join("")}</div>`;
  }
}
function renderStoryStage(){
  const st=$("#story"); if(!st) return;
  const b=BEATS[ST.i];
  st.querySelector(".flow").innerHTML=FLOW.map(([k,l],n)=>`<div class="fl ${b.f.includes(n)?"on":""}"><span class="ic">${k==="driver"?ICON.erick():k==="truck"?`<span style="color:${C.forest};display:flex">${ICN.truck.replace('viewBox','width="30" height="30" viewBox')}</span>`:roleIcon(k)}</span><span>${l}</span></div>`).join(`<i class="arr" aria-hidden="true"></i>`);
  st.querySelector(".screen").innerHTML=storyPhone(ST.i);
  st.querySelector(".screen").style.animation="none"; void st.querySelector(".screen").offsetWidth; st.querySelector(".screen").style.animation="";
  st.querySelector(".beatn").textContent=`${ST.i+1} / ${BEATS.length} · ${b.t}`;
  const cap=st.querySelector(".cap"); cap.textContent=b[ST.lang]; cap.className="cap"+(ST.lang==="hi"?" hi":"");
  st.querySelector(".dots").innerHTML=BEATS.map((_,n)=>`<button class="${n===ST.i?"on":n<ST.i?"d":""}" data-beat="${n}" aria-label="Beat ${n+1}"></button>`).join("");
  st.querySelectorAll("[data-beat]").forEach(x=>x.onclick=()=>{ storyBeat(+x.dataset.beat); });
  $("#stPlay").innerHTML = ST.playing ? "❚❚ Pause" : ST.ended ? "↺ Play again" : (ST.i===0?"▶ Play with voice":"▶ Resume");
  if(!ST.sound) $("#stPlay").innerHTML=$("#stPlay").innerHTML.replace(" with voice","");
  $("#stEnd").classList.toggle("hidden",!ST.ended);
}
function viewStory(app){
  const sp=canSpeak();
  app.innerHTML=`${backBtn()}<div id="story" class="story">
   <div class="st-head"><h1>LeadLoop in 45 seconds</h1>
    <div class="st-ctl"><div class="lang"><button data-sl="en" class="${ST.lang==="en"?"on":""}">EN</button><button data-sl="hi" class="${ST.lang==="hi"?"on":""}">हिंदी</button></div>
     ${sp?`<button class="hbtn2" id="stSnd" aria-pressed="${ST.sound}">${ST.sound?"🔊 Voice on":"🔇 Voice off"}</button>`:""}</div></div>
   <div class="flow" aria-hidden="true"></div>
   <div class="st-main"><div class="phone"><div class="notch"></div><div class="screen"></div></div>
    <div class="st-side"><div class="beatn"></div><p class="cap" aria-live="polite"></p><div class="dots"></div>
     <div class="row wrapr" style="gap:8px;margin-top:14px"><button class="btn hv" id="stPlay" style="width:auto;padding:10px 22px;margin:0"></button><button class="btn small sec" id="stNext" style="margin:0">Next ›</button></div>
     <div id="stEnd" class="hidden sheet tight" style="margin-top:14px"><b>See it for real</b><p class="small" style="margin:4px 0 10px">Every step above is a working screen in this app.</p>
      <button class="btn small" id="stTry" style="margin:0 6px 6px 0">Try it yourself, step by step</button><button class="btn small sec" id="stScreens" style="margin:0 6px 6px 0">See the real screens (8 stops)</button></div>
     <p class="small muted" id="stNote" style="margin-top:10px">${sp?"":"This browser can't speak, so the story plays with captions only."}</p>
    </div></div></div>`;
  $("#back").onclick=()=>{ storyStop(); go(S.user?homeOf():"login"); };
  app.querySelectorAll("[data-sl]").forEach(x=>x.onclick=()=>{ ST.lang=x.dataset.sl; try{localStorage.setItem("ll_story_lang",ST.lang);}catch(e){} app.querySelectorAll("[data-sl]").forEach(y=>y.classList.toggle("on",y===x)); storyBeat(ST.i); });
  if($("#stSnd")) $("#stSnd").onclick=()=>{ ST.sound=!ST.sound; try{localStorage.setItem("ll_story_sound",ST.sound?"1":"0");}catch(e){} $("#stSnd").textContent=ST.sound?"🔊 Voice on":"🔇 Voice off"; $("#stSnd").setAttribute("aria-pressed",ST.sound); storyBeat(ST.i); };
  $("#stPlay").onclick=()=>{ if(ST.playing){ storyStop(); renderStoryStage(); return; } ST.playing=true; storyBeat(ST.ended?0:ST.i); };
  $("#stNext").onclick=()=>storyBeat((ST.i+1)%BEATS.length);
  $("#stTry").onclick=()=>{ storyStop(); demoStart(); demoGo(1); };
  $("#stScreens").onclick=()=>{ storyStop(); tourStart(); };
  renderStoryStage();
}
try{ if(canSpeak()){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; } }catch(e){}
function storyStart(){ closeModal(); storyStop(); ST.i=0; ST.ended=false; ST.playing=true; S.view="story"; render(); storyBeat(0); }

$("#logoBtn").onclick=()=>{ if(TT.on) tourStop(); go("login"); };
S.pendingId = readHash();
render();
initDB().then(()=>{});
/* once records arrive, honour a #LL-xxxx deep link */
const hashIs = h => (location.hash||"").toLowerCase()===h;
const wantsTour = () => hashIs("#screens");
/* #tour is the printed QR destination: play the 45-second story at once. #story stays paused as before. */
const openStory = (autoplay) => {
  if(autoplay){ clearTimeout(ST.timer); ST.token++; try{ if(canSpeak()) speechSynthesis.cancel(); }catch(e){} }
  ST.i=0; ST.playing=!!autoplay; ST.ended=false; S.view="story"; render();
  if(autoplay) storyBeat(0);
};
window.addEventListener("hashchange",()=>{ if(!S.batteries.size) return; if(wantsTour()&&!TT.on) tourStart(); else if(hashIs("#tour")) openStory(true); else if(hashIs("#story")) openStory(false); });
(function waitHash(){ if(S.dbState==="ready"&&S.batteries.size){ if(wantsTour()) return tourStart(); if(hashIs("#tour")) return openStory(true); if(hashIs("#story")) return openStory(false); if(S.pendingId&&S.user) takeHash(); else if(S.pendingId) render(); return; } if(S.dbState==="none"||S.dbState.startsWith("error")) return; setTimeout(waitHash,250); })();
</script>
